name: Build privately and publish GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy-private-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-build-public-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.repository == 'x7z9/biju-chettan-fresh-meen-private'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check
        run: npm run lint

      - name: Build for the existing GitHub Pages URL
        env:
          VITE_BASE_PATH: /biju-chettan-fresh-meen/
        run: |
          npm run build
          cp dist/index.html dist/404.html
          cat > dist/README.md <<'EOF'
          # Public Website Deployment
          
          This repository contains the compiled static files used to publish the application through GitHub Pages.
          
          The editable application source code and development history are maintained separately in a private repository. This deployment repository is not an open-source distribution of the application.
          EOF
          # Do not publish AI Studio prompts, authoring notes, source manifests, or examples.
          find dist/assets/aistudio -type f \( -iname '*.md' -o -iname '*.txt' -o -iname '*.example' -o -iname '*.json' -o -iname '*.webmanifest' \) -delete
          # The former custom business sticker is private branding, not a public app asset.
          rm -f dist/assets/aistudio/a_high_quality_colorful_promotional_sticker_graphi_777412be.png
          # Keep 802e626a..., 85e7c938..., and 9e88a73e... referenced by catalog items #30-#32.

      - name: Wait for any active public Pages deployment
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            exit 0
          fi
          for attempt in $(seq 1 18); do
            status_code=$(curl -sS -o /tmp/runs.json -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/x7z9/biju-chettan-fresh-meen/actions/runs?per_page=5" || echo "000")
            if [ "$status_code" != "200" ]; then
              break
            fi
            active=$(node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync("/tmp/runs.json", "utf8"));
              const busy = (data.workflow_runs || []).some(
                (r) => ["in_progress", "queued", "waiting", "pending", "requested"].includes(r.status)
              );
              process.stdout.write(busy ? "1" : "0");
            ' 2>/dev/null || echo "0")
            if [ "$active" != "1" ]; then
              break
            fi
            echo "Public repo Pages deployment still in progress (attempt $attempt/18); waiting 10s..."
            sleep 10
          done

      - name: Publish compiled files only
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: x7z9/biju-chettan-fresh-meen
          publish_branch: main
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'
